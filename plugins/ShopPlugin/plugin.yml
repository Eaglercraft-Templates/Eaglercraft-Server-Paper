name: ShopPlugin
main: com.example.shop.ShopPlugin
version: 1.0
api-version: 1.12
commands:
  shop:
    description: Opens the shop menu.
    usage: /shop
  sell:
    description: Opens the sell menu.
    usage: /sell
  setprice:
    description: Opens the price editor GUI to set item sell prices.
    usage: /setprice [search term]
  sellprice:
    description: Opens the same price editor GUI as an alias to setprice.
    usage: /sellprice [search term]
  balance:
    description: Shows your current shop balance.
    usage: /balance
    aliases: [money]
permissions:
  shop.admin:
    description: Allows changing sell prices.
    default: op
